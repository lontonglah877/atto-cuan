name: Atto Cuan — siklus pasar

on:
  schedule:
    # Setiap 15 menit (UTC). GitHub cron = best effort, bisa telat beberapa menit.
    - cron: '*/15 * * * *'
    # Digest harian 07:00 WIB = 00:00 UTC
    - cron: '0 0 * * *'
    # Heartbeat 08:00 WIB = 01:00 UTC
    - cron: '0 1 * * *'
  workflow_dispatch:       # manual ATAU dari pemicu eksternal
    inputs:
      mode:
        description: 'cycle | digest | heartbeat'
        required: false
        default: 'cycle'
        type: choice
        options: [cycle, digest, heartbeat]

concurrency:
  group: atto-cuan
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Jalankan siklus / digest / heartbeat
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.ATTO_CUAN_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.ATTO_CUAN_CHAT }}
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            MODE="${INPUT_MODE:-cycle}"
          else
            case "$SCHEDULE" in
              "0 0 * * *") MODE=digest ;;
              "0 1 * * *") MODE=heartbeat ;;
              *)           MODE=cycle ;;
            esac
          fi
          echo "mode=$MODE"
          node sentinel.mjs "$MODE"
