name: Atto Cuan — siklus pasar

on:
  schedule:
    # Setiap 15 menit (UTC). GitHub cron = best effort, bisa telat beberapa menit.
    - cron: '*/15 * * * *'
    # Digest harian 07:00 WIB = 00:00 UTC
    - cron: '0 0 * * *'
    # Heartbeat 08:00 WIB = 01:00 UTC
    - cron: '0 1 * * *'
  workflow_dispatch: {}   # tombol "Run workflow" manual

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Jalankan siklus / digest / heartbeat
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.ATTO_CUAN_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.ATTO_CUAN_CHAT }}
        run: |
          CRON="${{ github.event.schedule }}"
          case "$CRON" in
            "0 0 * * *")  node sentinel.mjs digest ;;
            "0 1 * * *")  node sentinel.mjs heartbeat ;;
            *)            node sentinel.mjs cycle ;;
          esac
